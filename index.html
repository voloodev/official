<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Voloo</title>
</head>
<body>
    <header class="navbar">
        <div class="logo">Voloo</div>
        <button id="login-btn">Login</button>
    </header>

    <section id="projects" class="glass-card">
        <h2>My Projects</h2>
        <button onclick="document.getElementById('projectModal').style.display='block'">View Projects</button>
    </section>

    <section id="services" class="glass-card">
        <h2>Our Services</h2>
        <div class="service-container">
            <div class="service-circle">Websites</div>
            <div class="service-circle">Graphics</div>
            <div class="service-circle">Marketing</div>
        </div>
    </section>

    <section id="contact" class="glass-card">
        <h2>Contact Voloo</h2>
        <button onclick="document.getElementById('contactModal').style.display='block'">View Details</button>
    </section>

    <div id="contactModal" class="modal">
        <div class="glass-card modal-content">
            <span onclick="this.parentElement.parentElement.style.display='none'">&times;</span>
            <p>Name: Voloo</p>
            <p>Email: Voloo@gmail.com</p>
            <p>Whatsapp: 0762522078</p>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
